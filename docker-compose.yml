name: ai-document-assistant

x-backend-environment: &backend-environment
  NODE_ENV: production
  PORT: 5000
  REDIS_URL: redis://redis:6379/0
  REDIS_REQUIRED: "true"
  INGESTION_ASYNC_ENABLED: "true"
  SWAGGER_ENABLED: "false"
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
  FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}

services:
  postgres:
    image: pgvector/pgvector:pg16
    profiles: ["local-db"]
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aida}
      POSTGRES_USER: ${POSTGRES_USER:-aida}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [app, data]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits:
          memory: 1G
  redis:
    image: redis:7.4-alpine
    profiles: ["local-db"]
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [app, data]
    security_opt: ["no-new-privileges:true"]

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      <<: *backend-environment
    command: ["/app/node_modules/.bin/prisma", "migrate", "deploy", "--schema=/app/prisma/schema.prisma"]
    restart: "no"
    networks: [app, data]

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      <<: *backend-environment
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/health/live').then(r => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [app, data]
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits:
          memory: 1G

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      <<: *backend-environment
    command: ["node", "backend/dist/documents/ingestion-worker.js"]
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks: [app, data]
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits:
          memory: 1G
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/worker-ready"]
      interval: 30s
      timeout: 3s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        BACKEND_INTERNAL_URL: http://backend:5000
    environment:
      BACKEND_INTERNAL_URL: http://backend:5000
    ports:
      - "${FRONTEND_PORT:-8080}:3000"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks: [app]
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]

  backup:
    image: postgres:16-alpine
    profiles: ["backup"]
    environment:
      BACKUP_DATABASE_URL: ${DIRECT_URL}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ./scripts/backup.sh:/usr/local/bin/backup.sh:ro
      - database_backups:/backups
    entrypoint: ["/bin/sh", "/usr/local/bin/backup.sh", "--loop"]
    restart: unless-stopped
    networks: [app, data]
    security_opt: ["no-new-privileges:true"]

volumes:
  redis_data:
  postgres_data:
  database_backups:

networks:
  app:
  data:
    internal: true
