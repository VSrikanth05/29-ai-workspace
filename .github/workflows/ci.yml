name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-backend:
    name: Verify Backend (NestJS)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install root dependencies & generate Prisma
        run: |
          npm ci
          npx prisma generate
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Backend Typecheck & Build
        working-directory: backend
        run: |
          npm run typecheck
          npm run build
      - name: Backend Unit Tests
        working-directory: backend
        run: npm test -- --runInBand

  verify-frontend:
    name: Verify Frontend (Next.js 15)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install root dependencies & generate Prisma
        run: |
          npm ci
          npx prisma generate
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Frontend Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Frontend Unit Tests
        working-directory: frontend
        run: npm test
      - name: Frontend Production Build
        working-directory: frontend
        run: npm run build

