name: Production CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  security-events: write
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_DB: ci, POSTGRES_USER: ci, POSTGRES_PASSWORD: ci }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci -d ci" --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
      REDIS_URL: redis://localhost:6379/0
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_ANON_KEY: test
      SUPABASE_SERVICE_ROLE_KEY: test
      GEMINI_API_KEY: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci
      - name: Prisma validation and migration
        run: npx prisma validate && npx prisma generate && npx prisma migrate deploy
      - name: Backend lint, types, unit, integration, build
        working-directory: backend
        run: npm ci && npm run lint && npx tsc --noEmit -p tsconfig.spec.json && npm test -- --runInBand && npm run test:e2e -- --runInBand && npm run build
      - name: Frontend lint, types, components, build
        working-directory: frontend
        run: npm ci && npm run lint && npm run typecheck && npm test && npm run build
      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Playwright E2E
        working-directory: frontend
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-and-playwright-results
          path: |
            frontend/playwright-report
            frontend/test-results
            backend/coverage
          if-no-files-found: ignore

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci && npm audit --omit=dev --audit-level=high
      - run: npm ci --prefix backend && npm audit --prefix backend --omit=dev --audit-level=high
      - run: npm ci --prefix frontend && npm audit --prefix frontend --omit=dev --audit-level=high
      - uses: aquasecurity/trivy-action@0.28.0
        with: { scan-type: fs, scan-ref: ., format: sarif, output: trivy.sarif, severity: 'HIGH,CRITICAL', exit-code: '1' }
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with: { sarif_file: trivy.sarif }
      - uses: anchore/sbom-action@v0
        with: { path: ., format: spdx-json, output-file: workspace-sbom.spdx.json }
      - uses: actions/upload-artifact@v4
        with: { name: security-sbom, path: workspace-sbom.spdx.json }

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: [verify, security]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with: { context: ., file: backend/Dockerfile, push: false, cache-from: 'type=gha,scope=backend', cache-to: 'type=gha,mode=max,scope=backend' }
      - uses: docker/build-push-action@v6
        with: { context: frontend, file: frontend/Dockerfile, push: false, build-args: 'BACKEND_INTERNAL_URL=http://backend:5000', cache-from: 'type=gha,scope=frontend', cache-to: 'type=gha,mode=max,scope=frontend' }
      - name: Validate Compose
        run: cp .env.example .env && docker compose config --quiet

  release-package:
    runs-on: ubuntu-latest
    needs: [verify, security, containers]
    steps:
      - uses: actions/checkout@v4
      - name: Create deployment package
        run: tar -czf 29-ai-workspace-${GITHUB_SHA}.tar.gz docker-compose.yml .env.example prisma docs scripts load-tests README.md
      - run: sha256sum 29-ai-workspace-${GITHUB_SHA}.tar.gz > 29-ai-workspace-${GITHUB_SHA}.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with: { name: production-release-package, path: '29-ai-workspace-*' }
